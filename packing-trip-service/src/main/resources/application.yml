server:
  port: 8080

spring:
  application:
    name: packing-trip-service
  data:
    mongodb:
      auto-index-creation: true

app:
  mongo:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:packpilot}
    username: ${MONGO_USERNAME:}
    password: ${MONGO_PASSWORD:}
    auth-database: ${MONGO_AUTH_DATABASE:admin}
  generator:
    base-url: ${GENERATOR_SERVICE_URL:http://packing-generator-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
