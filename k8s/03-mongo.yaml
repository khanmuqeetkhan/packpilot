apiVersion: v1
kind: Service
metadata:
  name: packpilot-mongo
  namespace: packpilot
spec:
  clusterIP: None
  selector:
    app: packpilot-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: packpilot-mongo
  namespace: packpilot
spec:
  serviceName: packpilot-mongo
  replicas: 1
  selector:
    matchLabels:
      app: packpilot-mongo
  template:
    metadata:
      labels:
        app: packpilot-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          envFrom:
            - secretRef:
                name: mongo-credentials
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 20
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
