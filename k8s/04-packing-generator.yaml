apiVersion: apps/v1
kind: Deployment
metadata:
  name: packing-generator-service
  namespace: packpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: packing-generator-service
  template:
    metadata:
      labels:
        app: packing-generator-service
    spec:
      containers:
        - name: packing-generator-service
          image: localhost/packing-generator-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: packing-generator-service
  namespace: packpilot
spec:
  type: ClusterIP
  selector:
    app: packing-generator-service
  ports:
    - port: 8080
      targetPort: 8080
